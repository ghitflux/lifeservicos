services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - life-net

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - uploads:/app/uploads
    ports: ["8000:8000"]
    environment:
      - ENV=${ENV:-production}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000,http://localhost:3001}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - TZ=America/Sao_Paulo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    labels:
      - autoheal=true
    networks:
      - life-net

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    labels:
      - autoheal=true
    networks:
      - life-net

  mobile:
    image: node:20
    working_dir: /app
    volumes:
      - ../life-mobile:/app
    environment:
      - API_URL=http://api:8000
      - NEXT_PUBLIC_API_BASE_URL=http://api:8000
    command: sh -c "npm install && npm run web"
    ports:
      - "19006:19006"
    depends_on:
      - api
    stdin_open: true
    tty: true
    networks:
      - life-net

  autoheal:
    image: willfarrell/autoheal
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10

volumes:
  db_data:
  uploads:

networks:
  life-net:
    name: life-net
